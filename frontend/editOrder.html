<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Заказы - PrideStudio</title>
    <link rel="stylesheet" href="/editOrder/style.css">
    <link rel="stylesheet" href="/navbar/style.css"> <!-- Подключаем стили -->
</head>
<body>

    <!-- Навигация -->
    <div id="navbar"></div>

    <div class="hero">
        <div class="container">
            <h1>Редактирование заказа</h1>
        </div>
    </div>

    <div class="edit-section">
        <div class="edit-container">
        <form id="edit-order-form" enctype="multipart/form-data">
        
            <input type="hidden" id="order-id">

            <label for="order-image">Изображение</label>
            <input type="file" id="order-image" name="image">
            
            <label for="order-name">Название</label>
            <input type="text" id="order-name" required>

            <label for="order-description">Описание</label>
            <textarea id="order-description" required></textarea>

            <label for="order-number">Номер телефона</label>
            <input type="text" name="number" id="order-number" placeholder="0_________">
            
            <label for="order-status">Статус</label>
            <select id="order-status" required>
                <option value="new">Новый</option>
                <option value="in process">В процессе</option>
                <option value="ended">Выполнен</option>
            </select>
            
            <label for="order-price">Цена (грн)</label>
            <input type="text" id="order-price" required>
            
            <h2>Назначенные рабочие</h2>
            <div id="workers-list">
                <!-- Чекбоксы рабочих будут вставляться сюда -->
            </div>
            
            <div class="form_buttons">
                <a href="#" id="back-button" class="btn back-btn">Назад</a>
                <button type="submit" class="btn">Сохранить</button>
            </div>
        </form>
    </div>
</div>

    <script src="https://unpkg.com/inputmask@5.0.8/dist/inputmask.min.js"></script>

    <script>
        //Маска на номер
        const im = new Inputmask("0999999999");
        im.mask(document.getElementById("number"));

    </script>

    <script src="/editOrder/script.js"></script>

    <script>
        async function loadNavbar() {
        const response = await fetch("navbar.html");
        const navbarHtml = await response.text();
        document.getElementById("navbar").innerHTML = navbarHtml;
    }
    loadNavbar();
    </script>
</body>
</html>
